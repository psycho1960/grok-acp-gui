[package]
name = "grok-acp-gui"
version = "0.1.16"
description = "Windows desktop shell for Grok ACP GUI"
authors = ["Grok ACP GUI contributors"]
edition = "2021"

[lib]
name = "grok_acp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test-only escape hatch for native Windows WebDriver runs. Production builds
# keep using Tauri's managed app-data directory.
e2e-isolated-data = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.0", features = [] }
tauri-plugin-dialog = "~2.7.0"
tauri-plugin-store = "~2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
# GAG-005: async process management for Grok ACP runtime.
# Tokio is already pulled in transitively by Tauri; we declare it
# directly with the features needed for child-process stdio, timers,
# and synchronisation primitives.
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
# async_trait for the AgentRuntime trait object (GAG-005).
async-trait = "0.1"

[dev-dependencies]
# Used by integration tests that spawn the real tokio runtime.
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "test-util"] }
