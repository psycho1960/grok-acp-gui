[package]
name = "grok-acp-gui"
version = "0.1.16"
description = "Windows desktop shell for Grok ACP GUI"
authors = ["Grok ACP GUI contributors"]
edition = "2021"

[lib]
name = "grok_acp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
